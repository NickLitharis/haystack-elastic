[project]
name = "haystack-elastic"
version = "0.1.0"
description = "Q&A search over a scraped corpus - keyword BM25 in Elasticsearch against semantic retrieval with Haystack"
readme = "README.md"
requires-python = ">=3.9,<3.11"
dependencies = [
    "farm-haystack",
    "elasticsearch>=7.10,<8",
]
[dependency-groups]
dev = ["pytest>=8"]
[tool.uv]
package = false

# Bare `pytest` does not put the repository root on sys.path, so `import metrics`
# fails; the retrieval metrics themselves need no third-party packages.
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
